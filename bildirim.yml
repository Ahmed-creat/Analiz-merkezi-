# ============================================================
# ANALİZ MERKEZİ — TEK İŞ AKIŞI: gözcü + okul çekimi + bildirimler
# 30 dk: okul sitesi gözcüsü · 07:30: Okulizyon + site + tam set
# 19:30: kritikler · Elle Run: çekim + bildirim.
# Betikler NEREDE olursa orada çalışır: functions/ klasörü,
# herhangi bir alt klasör (pwa-files/ vb.) veya doğrudan kökte.
# package.json'a upload sırasında bulaşan çöp otomatik temizlenir.
# Secret: FIREBASE_SERVICE_ACCOUNT (başka anahtar gerekmez)
# ============================================================
name: Bildirim Motoru
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "30 4 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Betiklerin olduğu klasörü bul
        id: kok
        run: |
          # 1) okulizyon-cek.js dosyasını herhangi bir derinlikte ara (node_modules hariç)
          DOSYA=$(find . -maxdepth 4 -type f -name "okulizyon-cek.js" -not -path "*/node_modules/*" | head -1)
          if [ -n "$DOSYA" ]; then
            DIZIN=$(dirname "$DOSYA")
            echo "dizin=$DIZIN" >> "$GITHUB_OUTPUT"
            echo "Betikler burada: $DIZIN"
          else
            echo "dizin=YOK" >> "$GITHUB_OUTPUT"
            echo "❌ okulizyon-cek.js hiçbir yerde bulunamadı!"
          fi

      - name: Betikler yoksa dur
        if: steps.kok.outputs.dizin == 'YOK'
        run: |
          echo "❌ functions dosyaları (okulizyon-cek.js vb.) depoda yok."
          echo "→ guncelleme.zip içindeki dosyaları GitHub'a yükle (functions klasörü ya da tek tek)."
          exit 1

      - name: package.json'u onar (upload çöpünü temizle)
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"analiz-merkezi-functions","version":"1.0.0","private":true,"dependencies":{"firebase-admin":"^12.1.0","firebase-functions":"^5.0.1","cheerio":"^1.0.0","playwright":"^1.49.1","tesseract.js":"^5.1.0"}}' > package.json
            echo "package.json yoktu → otomatik oluşturuldu ✓"
          else
            node -e "
              const fs = require('fs');
              let s = fs.readFileSync('package.json', 'utf8');
              const i = s.lastIndexOf('}');
              if (i > -1 && s.slice(i + 1).trim() !== '') {
                console.log('Temizlendi: son } sonrası çöp kaldırıldı (' + s.slice(i + 1).trim().length + ' karakter)');
                fs.writeFileSync('package.json', s.slice(0, i + 1) + '\n');
              }
              JSON.parse(fs.readFileSync('package.json', 'utf8'));
              console.log('package.json geçerli ✓');
            "
          fi

      - name: Bağımlılıklar
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: npm install --no-fund --no-audit

      - name: Okulizyon için tarayıcı kur (Chromium)
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: npx playwright install chromium --with-deps

      - name: Değişiklik gözcüsü (30 dk'da bir)
        if: ${{ github.event.schedule == '*/30 * * * *' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node degisiklik-kontrol.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Okulizyon çek (sabah + elle)
        if: ${{ github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node okulizyon-cek.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Okul sitesi (duyuru + ders programı OCR)
        if: ${{ github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node okul-sitesi.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Bildirimleri gönder (sabah tam / akşam kritik)
        if: ${{ github.event.schedule != '*/30 * * * *' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node bildirim-gonder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          
