# ============================================================
# ANALİZ MERKEZİ — TEK İŞ AKIŞI: gözcü + okul çekimi + bildirimler
# 30 dk: okul sitesi gözcüsü · 07:30: Okulizyon + site + tam set
# 19:30: kritikler · Elle Run: çekim + bildirim.
# Secret: FIREBASE_SERVICE_ACCOUNT (başka anahtar gerekmez)
# ============================================================
name: Bildirim Motoru
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "30 4 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Paketleri kur
        run: npm install

      - name: Okulizyon Çekimi ve Bildirimleri Çalıştır
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node okulizyon-cek.js
        
