# ============================================================
# ANALİZ MERKEZİ — TEK İŞ AKIŞI: gözcü + okul çekimi + bildirimler
# 30 dk: okul sitesi gözcüsü · 07:30: Okulizyon + site çekimi + tam set
# 19:30: kritik bildirimler. Elle Run workflow: çekim + bildirim.
# Klasör yapısını OTOMATİK algılar: dosyalar ister kökte ister
# 'analiz-merkezi-pwa/' klasöründe yüklü olsun çalışır.
# Secret: FIREBASE_SERVICE_ACCOUNT (başka anahtar gerekmez)
# ============================================================
name: Bildirim Motoru
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "30 4 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Klasörü bul (functions)
        id: kok
        run: |
          if [ -d "pwa-files/functions" ]; then 
            echo "kok=pwa-files" >> "$GITHUB_OUTPUT"
            echo "✅ Bulunan kök: pwa-files"
          elif [ -d "analiz-merkezi-pwa/functions" ]; then 
            echo "kok=analiz-merkezi-pwa" >> "$GITHUB_OUTPUT"
            echo "✅ Bulunan kök: analiz-merkezi-pwa"
          elif [ -d "functions" ]; then 
            echo "kok=." >> "$GITHUB_OUTPUT"
            echo "✅ Bulunan kök: ."
          else 
            echo "kok=YOK" >> "$GITHUB_OUTPUT"
            echo "❌ functions klasörü bulunamadı!"
          fi

      - name: functions klasörü eksikse dur ve söyle
        if: steps.kok.outputs.kok == 'YOK'
        run: |
          echo "❌ 'functions' klasörü depoda bulunamadı!"
          echo "→ guncelleme.zip içindeki 'functions' KLASÖRÜNÜ GitHub'a yükle:"
          echo "  Add file → Upload files → functions klasörünü sürükle → Commit"
          exit 1

      - name: Bağımlılıklar
        if: steps.kok.outputs.kok != 'YOK'
        run: npm install --no-fund --no-audit
        working-directory: ${{ steps.kok.outputs.kok }}/functions

      - name: Okulizyon için tarayıcı kur (Chromium)
        if: steps.kok.outputs.kok != 'YOK'
        run: npx playwright install chromium --with-deps
        working-directory: ${{ steps.kok.outputs.kok }}/functions

      - name: Değişiklik gözcüsü (30 dk'da bir)
        if: ${{ github.event.schedule == '*/30 * * * *' && steps.kok.outputs.kok != 'YOK' }}
        run: node degisiklik-kontrol.js
        working-directory: ${{ steps.kok.outputs.kok }}/functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Okulizyon çek (sabah + elle)
        if: ${{ (github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch') && steps.kok.outputs.kok != 'YOK' }}
        run: node okulizyon-cek.js
        working-directory: ${{ steps.kok.outputs.kok }}/functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Okul sitesi (duyuru + ders programı OCR)
        if: ${{ (github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch') && steps.kok.outputs.kok != 'YOK' }}
        run: node okul-sitesi.js
        working-directory: ${{ steps.kok.outputs.kok }}/functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Bildirimleri gönder (sabah tam / akşam kritik)
        if: ${{ github.event.schedule != '*/30 * * * *' && steps.kok.outputs.kok != 'YOK' }}
        run: node bildirim-gonder.js
        working-directory: ${{ steps.kok.outputs.kok }}/functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          
