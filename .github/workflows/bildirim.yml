# ============================================================
# ANALİZ MERKEZİ — TEK İŞ AKIŞI: gözcü + okul çekimi + bildirimler
# 30 dk: okul sitesi gözcüsü · 07:30: Okulizyon + site + tam set
# 19:30: kritikler · Elle Run: çekim + bildirim.
# KENDİNE YETERLİ: package.json depoda eski/bozuk/hiç yok olursa
# doğru sürümlerle yeniden yazar; betikleri herhangi bir klasörde bulur.
# Secret: FIREBASE_SERVICE_ACCOUNT
# ============================================================
name: Bildirim Motoru
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "30 4 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Betiklerin olduğu klasörü bul
        id: kok
        run: |
          DOSYA=$(find . -maxdepth 4 -type f -name "okulizyon-cek.js" -not -path "*/node_modules/*" | head -1)
          if [ -n "$DOSYA" ]; then
            echo "dizin=$(dirname "$DOSYA")" >> "$GITHUB_OUTPUT"
            echo "Betikler burada: $(dirname "$DOSYA")"
          else
            echo "dizin=YOK" >> "$GITHUB_OUTPUT"
            echo "❌ okulizyon-cek.js bulunamadı — guncelleme.zip'teki functions dosyalarını yükle"
          fi

      - name: Betikler yoksa dur
        if: steps.kok.outputs.dizin == 'YOK'
        run: echo "functions dosyaları eksik"; exit 1

      - name: Bağımlılıkları kur (standart package.json — depodakine bakmaz)
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: |
          cat > package.json <<'PKJ'
          {
            "name": "analiz-merkezi-functions",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "firebase-admin": "12.1.0",
              "firebase-functions": "5.0.1",
              "cheerio": "1.0.0",
              "playwright": "1.49.1",
              "tesseract.js": "5.1.0"
            }
          }
          PKJ
          npm install --no-fund --no-audit

      - name: Okulizyon için tarayıcı kur (sürüme birebir)
        working-directory: ${{ steps.kok.outputs.dizin }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          [ -d node_modules/playwright ] || npm install playwright@1.49.1 --no-save --no-fund --no-audit
          node node_modules/playwright/cli.js install chromium --with-deps
          node -e "console.log('playwright:', require('playwright/package.json').version, '✓')"

      - name: Değişiklik gözcüsü (30 dk'da bir)
        if: ${{ github.event.schedule == '*/30 * * * *' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node degisiklik-kontrol.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Okulizyon çek (sabah + elle)
        if: ${{ github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node okulizyon-cek.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Okul sitesi (duyuru + ders programı OCR)
        if: ${{ github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node okul-sitesi.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Bildirimleri gönder (sabah tam / akşam kritik)
        if: ${{ github.event.schedule != '*/30 * * * *' }}
        working-directory: ${{ steps.kok.outputs.dizin }}
        run: node bildirim-gonder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          
